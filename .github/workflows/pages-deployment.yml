name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    name: Verify and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source data
        run: npm run check

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Pages site
        run: npm run build:pages

      - name: Verify deployable output
        shell: bash
        run: |
          test -f dist/index.html
          test "$(find dist -type f -name '*.html' | wc -l | tr -d ' ')" = "1"
          test -z "$(find dist -path '*/corpus/*' -print -quit)"
          node <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("dist/data/manifest.json", "utf8"));
          const expectedDates = [...manifest.dates].sort().reverse();
          if (manifest.latest !== manifest.dates[0]) process.exit(1);
          if (JSON.stringify(manifest.dates) !== JSON.stringify(expectedDates)) process.exit(1);
          NODE

      - name: Deploy production to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dsh-group-chat-diary --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
